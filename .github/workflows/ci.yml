name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build meta
        run: pnpm --filter meta build

      - name: Build delegation-risk
        run: pnpm --filter delegation-risk build

      - name: Build reasoning-processes
        run: pnpm --filter reasoning-processes build

      - name: Build evaluation-engineering
        run: pnpm --filter evaluation-engineering build

      - name: Check links, anchors, and KaTeX in built wikis
        run: python3 scripts/check-built-links.py
