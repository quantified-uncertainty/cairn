name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build meta
        run: pnpm --filter meta build

      - name: Build delegation-risk
        run: pnpm --filter delegation-risk build

      - name: Build reasoning-processes
        run: pnpm --filter reasoning-processes build

      - name: Build evaluation-engineering
        run: pnpm --filter evaluation-engineering build

      - name: Check links, anchors, and KaTeX in built wikis
        run: python3 scripts/check-built-links.py
