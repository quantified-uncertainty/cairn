name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build meta
        run: pnpm --filter meta build

      - name: Build delegation-risk
        run: pnpm --filter delegation-risk build

      - name: Build reasoning-processes
        run: pnpm --filter reasoning-processes build

      - name: Build evaluation-engineering
        run: pnpm --filter evaluation-engineering build

      - name: Check links, anchors, and KaTeX in built wikis
        run: python3 scripts/check-built-links.py
