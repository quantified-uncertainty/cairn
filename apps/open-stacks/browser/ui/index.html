<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks Browser</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="bar">
  <button id="panel-btn" class="ghost icon" aria-label="Side panel"><span class="pi"></span></button>
  <div class="brand"><span class="mark" aria-hidden="true"></span>Stacks</div>
  <nav id="views" class="views" aria-label="View"></nav>
  <div id="lanes" class="chips" aria-label="Lanes"></div>
  <button id="wheel-btn" class="ghost"></button>
  <button id="search-btn" class="ghost" title="Search (/)">Search <kbd>/</kbd></button>
  <button id="saved-btn" class="ghost" title="Saved (b)">Saved <span id="saved-n">0</span></button>
  <button id="keys-btn" class="ghost" title="Keys (?)">?</button>
  <button id="st-btn" class="ghost" type="button" title="Settings (, or Ctrl+,)" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <span id="net"></span>
</header>

<div id="main" data-view="feed">
  <aside id="panel" aria-label="About this item"></aside>
  <section id="stage">
    <div id="item-head"></div>
    <div id="spread" aria-live="polite"></div>
    <div id="scrub" aria-label="All pages"></div>
    <div id="track" aria-label="Where you are in this item: hover to look through it, click to go there"><div class="tr-bar"><div class="tr-fill"></div><div class="tr-marks"></div></div><div class="tr-hover"></div></div>
  </section>
  <section id="wall" hidden><div id="grid"></div><div id="grid-more"></div></section>
</div>

<div id="search" hidden>
  <div class="s-box">
    <input id="s-input" type="search" placeholder="Title, author, subject… (Enter: jump · Shift+Enter: browse all results)" autocomplete="off" spellcheck="false">
    <ol id="s-results"></ol>
  </div>
</div>
<aside id="saved" hidden><h2>Saved</h2><ol id="saved-list"></ol><a href="/notes.md">Export notes (Markdown)</a></aside>

<div id="peek" hidden><div class="pk-page"></div><div class="pk-label"></div></div>
<div id="keys" hidden>
  <div class="k-box">
    <h2>Keys</h2>
    <dl id="keys-dl"></dl>
    <p class="k-foot">Mouse wheel (continue) — Down: next page, then next item · Up: go back · Shift+wheel: pages. W or a middle click switches continue → items → pages. Click a page to zoom.</p>
  </div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
