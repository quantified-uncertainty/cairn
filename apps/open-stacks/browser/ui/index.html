<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks Browser</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="bar">
  <div class="brand"><span class="mark" aria-hidden="true"></span>Stacks</div>
  <nav class="views" aria-label="View">
    <button id="v-feed" class="on" title="Feed (f)">Feed</button>
    <button id="v-wall" title="Wall (w)">Wall</button>
  </nav>
  <div id="sources" class="chips" aria-label="Sources"></div>
  <div id="shelves" class="chips shelves" aria-label="Shelves"></div>
  <button id="search-btn" class="search-btn" title="Search (/)">Search <kbd>/</kbd></button>
  <button id="saved-btn" class="saved-btn" title="Saved (b)">Saved <span id="saved-n">0</span></button>
</header>

<main id="feed" class="view">
  <section id="item-head"></section>
  <section id="spread" aria-live="polite"></section>
  <section id="upnext" aria-label="Up next"></section>
</main>

<main id="wall" class="view" hidden>
  <div id="grid"></div>
  <div id="grid-more"></div>
</main>

<div id="reader" hidden>
  <div class="r-head"><div id="r-title"></div><div class="r-actions"><a id="r-orig" target="_blank" rel="noopener">Original ↗</a><button id="r-close">Close <kbd>Esc</kbd></button></div></div>
  <div id="r-pages"></div>
</div>

<div id="search" hidden>
  <div class="s-box">
    <input id="s-input" type="search" placeholder="Title, author or subject…  (Enter: jump · Shift+Enter: browse all results)" autocomplete="off" spellcheck="false">
    <ol id="s-results"></ol>
  </div>
</div>

<aside id="info" hidden></aside>
<aside id="saved" hidden><h2>Saved</h2><ol id="saved-list"></ol></aside>

<footer id="keys">
  <span><kbd>j</kbd>/<kbd>k</kbd> next / previous book</span>
  <span><kbd>l</kbd>/<kbd>h</kbd> turn pages</span>
  <span><kbd>r</kbd> random spot</span>
  <span><kbd>t</kbd> start</span>
  <span><kbd>Enter</kbd> open</span>
  <span><kbd>s</kbd> save</span>
  <span><kbd>x</kbd> less like this</span>
  <span><kbd>i</kbd> info</span>
  <span><kbd>m</kbd> more like this</span>
  <span><kbd>g</kbd> go to page</span>
  <span><kbd>+</kbd>/<kbd>-</kbd> pages</span>
  <span><kbd>o</kbd> original</span>
  <span id="net"></span>
</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
