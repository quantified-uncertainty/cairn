<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks Browser</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="bar">
  <button id="panel-btn" class="ghost icon" aria-label="Side panel"><span class="pi"></span></button>
  <nav id="views" class="views" aria-label="View"></nav>
  <button id="view-pick" class="ghost pick" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <div id="lanes" class="chips" aria-label="Lanes"></div>
  <button id="lane-pick" class="ghost pick" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  <button id="wheel-btn" class="ghost"></button>
  <button id="search-btn" class="ghost" title="Search (/)" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></svg><span class="lbl">Search</span> <kbd>/</kbd></button>
  <button id="saved-btn" class="ghost" title="Saved (b)" aria-label="Saved"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.53 2.3a.53.53 0 0 1 .95 0l2.31 4.68a2.12 2.12 0 0 0 1.6 1.16l5.16.76a.53.53 0 0 1 .3.9l-3.74 3.64a2.12 2.12 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.12 2.12 0 0 0-1.97 0L6.4 21.01a.53.53 0 0 1-.77-.56l.88-5.14a2.12 2.12 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .29-.91l5.17-.75a2.12 2.12 0 0 0 1.6-1.16z"/></svg><span class="lbl">Saved</span> <span id="saved-n">0</span></button>
  <button id="keys-btn" class="ghost" title="Keys (?)" aria-label="Keys"><span class="lbl">Keys</span>?</button>
  <button id="focus-btn" class="ghost" type="button" title="Focus: only the pages, no bars or side panel (d) · Esc leaves" aria-label="Focus" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  <button id="st-btn" class="ghost" type="button" title="Settings (, or Ctrl+,)" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button id="more-btn" class="ghost" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false" hidden><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  <span id="net"></span>
  <div id="more" role="menu" aria-label="More" hidden></div>
</header>

<div id="main" data-view="feed">
  <aside id="panel" aria-label="About this item"></aside>
  <section id="stage">
    <div id="item-head"></div>
    <div id="spread" aria-live="polite"></div>
    <div id="scrub" aria-label="All pages"></div>
    <div id="track" aria-label="Where you are in this item: hover to look through it, click to go there"><div class="tr-bar"><div class="tr-fill"></div><div class="tr-marks"></div></div><div class="tr-hover"></div></div>
  </section>
  <section id="wall" hidden><div id="grid"></div><div id="grid-more"></div></section>
</div>

<div id="search" hidden>
  <div class="s-box">
    <input id="s-input" type="search" placeholder="Title, author, subject… (Enter: jump · Shift+Enter: browse all results)" autocomplete="off" spellcheck="false">
    <ol id="s-results"></ol>
  </div>
</div>
<aside id="saved" hidden><h2>Saved</h2><ol id="saved-list"></ol><a href="/notes.md">Export notes (Markdown)</a></aside>

<div id="peek" hidden><div class="pk-page"></div><div class="pk-label"></div></div>
<div id="keys" hidden>
  <div class="k-box">
    <h2>Keys</h2>
    <dl id="keys-dl"></dl>
    <p class="k-foot">Mouse wheel (continue) — Down: next page, then next item · Up: go back · Shift+wheel: pages. W or a middle click switches continue → items → pages. Click a page to zoom.</p>
  </div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
