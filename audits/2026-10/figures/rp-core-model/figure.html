<figcaption>Information about the world can only leak out of the pipeline, so each loss is a measurable gap. Corruption is not a loss: a captured evaluator can keep every bit and still reverse the sign. In this illustrative process, where every width and number is computed, the misled judge loses 0.92 bits: more than the 0.26 the honest process delivers.</figcaption>
