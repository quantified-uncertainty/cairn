<svg class="eia-wide" viewBox="0 0 784 652" role="img" aria-label="Two-loop diagram. Object loop: producers, human or AI, send information I to the scorer V(I, A, U), which measures how agent A&#x27;s beliefs shift, weighted by the question portfolio U; the scorer pays the surprise share now, escrowed and clawed back if validation fails. Meta loop: the scorer&#x27;s V scores go to a meta evaluator, which compares them with out-of-band signals of realized value (realized outcomes, retrodiction, human spot-evaluations, randomized holdouts) and sends back a revised V: a new agent A, question weights U and validators. The meta evaluator and its signals sit out of band: producers cannot see or choose them. A timeline zooms on the payment: the surprise share is escrowed at submission, fast partial validators (consistency checks, retrodiction) advance credit, and at resolution the pay is kept plus a validation share, clawed back, or, if the claim never resolves, left unvalidated, which is where the persuasion gradient survives."><defs><marker id="eiaw-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" class="ahead"/></marker></defs><rect class="zone" x="574" y="8" width="202" height="470" rx="8"/><text class="lab acc strong" x="675.0" y="34" text-anchor="middle">Out of band</text><text class="lab acc" x="675.0" y="53" text-anchor="middle">producers cannot</text><text class="lab acc" x="675.0" y="72" text-anchor="middle">see or choose these</text><rect class="box" x="8" y="176" width="170" height="64" rx="4"/><text class="ttl" x="93.0" y="203.5" text-anchor="middle">Producers</text><text class="lab muted" x="93.0" y="222.5" text-anchor="middle">human or AI researchers</text><rect class="box" x="284" y="160" width="232" height="96" rx="4"/><text class="ttl" x="400.0" y="194.0" text-anchor="middle">Scorer V(I, A, U)</text><text class="lab muted" x="400.0" y="213.0" text-anchor="middle">shift in agent A’s beliefs,</text><text class="lab muted" x="400.0" y="232.0" text-anchor="middle">weighted by question portfolio U</text><rect class="box" x="588" y="172" width="180" height="82" rx="4"/><text class="ttl" x="678.0" y="199.0" text-anchor="middle">Meta evaluator</text><text class="lab muted" x="678.0" y="218.0" text-anchor="middle">do V scores track</text><text class="lab muted" x="678.0" y="237.0" text-anchor="middle">realized value?</text><rect class="box" x="588" y="330" width="180" height="128" rx="4"/><text class="ttl" x="678.0" y="361.0" text-anchor="middle">Out-of-band signals</text><text class="lab muted" x="678.0" y="380.0" text-anchor="middle">realized outcomes</text><text class="lab muted" x="678.0" y="399.0" text-anchor="middle">retrodiction</text><text class="lab muted" x="678.0" y="418.0" text-anchor="middle">human spot-evaluations</text><text class="lab muted" x="678.0" y="437.0" text-anchor="middle">randomized holdouts</text><path class="flow" d="M93 175 C110 70 300 60 334 158" marker-end="url(#eiaw-ah)"/><text class="lab" x="214" y="62" text-anchor="middle">information I</text><text class="lab muted" x="214" y="81" text-anchor="middle">a paper, data, an argument</text><path class="flow" d="M334 257 C300 362 110 352 93 242" marker-end="url(#eiaw-ah)"/><text class="lab" x="214" y="362" text-anchor="middle">payment: surprise share now</text><text class="lab" x="214" y="381" text-anchor="middle">(escrowed), validation share</text><text class="lab" x="214" y="400" text-anchor="middle">at resolution</text><text class="lab muted strong" x="234" y="205" text-anchor="middle">Object</text><text class="lab muted strong" x="234" y="224" text-anchor="middle">loop</text><path class="flow" d="M476 159 C496 80 630 70 660 170" marker-end="url(#eiaw-ah)"/><text class="lab" x="462" y="112" text-anchor="end">V scores for each I</text><path class="flow" d="M660 255 C630 352 500 352 476 258" marker-end="url(#eiaw-ah)"/><text class="lab" x="560" y="372" text-anchor="end">revised V: agent A,</text><text class="lab" x="560" y="391" text-anchor="end">weights U, validators</text><text class="lab muted strong" x="546" y="205" text-anchor="middle">Meta</text><text class="lab muted strong" x="546" y="224" text-anchor="middle">loop</text><path class="flow" d="M700 328 L700 257" marker-end="url(#eiaw-ah)"/><text class="lab" x="708" y="288">realized</text><text class="lab" x="708" y="307">value</text><line class="hair" x1="8" y1="492" x2="776" y2="492"/><text class="lab strong" x="8" y="518">Zoom on the payment arrow: one piece of information, over time</text><line class="flow" x1="12" y1="576" x2="460" y2="576"/><line class="flow" x1="12" y1="571" x2="12" y2="581"/><line class="flow" x1="214" y1="571" x2="214" y2="581"/><text class="lab strong" x="12" y="544">submitted</text><text class="lab muted" x="12" y="563">surprise share into escrow</text><text class="lab muted" x="12" y="600">measured as belief shift</text><text class="lab strong" x="214" y="544">fast partial validators</text><text class="lab muted" x="214" y="563">consistency checks, retrodiction</text><text class="lab muted" x="214" y="600">credit advanced early</text><text class="lab strong" x="458" y="600" text-anchor="end">at resolution</text><path class="flow" d="M460 576 C482 576 476 534 498 534" marker-end="url(#eiaw-ah)"/><path class="flow" d="M460 576 C482 576 476 576 498 576" marker-end="url(#eiaw-ah)"/><path class="flow" d="M460 576 C482 576 476 618 498 618" marker-end="url(#eiaw-ah)"/><text class="lab" x="506" y="539">validated: kept, plus validation share</text><text class="lab" x="506" y="581">fails: surprise share clawed back</text><text class="lab strong" x="506" y="623">never resolves: stays unvalidated,</text><text class="lab" x="506" y="642">so the persuasion gradient survives</text></svg>