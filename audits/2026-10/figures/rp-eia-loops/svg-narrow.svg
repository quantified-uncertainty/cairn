<svg class="eia-narrow" viewBox="0 0 343 1155" role="img" aria-label="Two-loop diagram. Object loop: producers, human or AI, send information I to the scorer V(I, A, U), which measures how agent A&#x27;s beliefs shift, weighted by the question portfolio U; the scorer pays the surprise share now, escrowed and clawed back if validation fails. Meta loop: the scorer&#x27;s V scores go to a meta evaluator, which compares them with out-of-band signals of realized value (realized outcomes, retrodiction, human spot-evaluations, randomized holdouts) and sends back a revised V: a new agent A, question weights U and validators. The meta evaluator and its signals sit out of band: producers cannot see or choose them. A timeline zooms on the payment: the surprise share is escrowed at submission, fast partial validators (consistency checks, retrodiction) advance credit, and at resolution the pay is kept plus a validation share, clawed back, or, if the claim never resolves, left unvalidated, which is where the persuasion gradient survives."><defs><marker id="eian-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" class="ahead"/></marker></defs><rect class="zone" x="3" y="376" width="337" height="396" rx="8"/><rect class="box" x="52" y="8" width="239" height="56" rx="4"/><text class="ttl" x="171.5" y="31.5" text-anchor="middle">Producers</text><text class="lab muted" x="171.5" y="50.5" text-anchor="middle">human or AI researchers</text><rect class="box" x="52" y="222" width="239" height="86" rx="4"/><text class="ttl" x="171.5" y="251.0" text-anchor="middle">Scorer V(I, A, U)</text><text class="lab muted" x="171.5" y="270.0" text-anchor="middle">shift in agent A’s beliefs,</text><text class="lab muted" x="171.5" y="289.0" text-anchor="middle">weighted by question portfolio U</text><rect class="box" x="52" y="496" width="239" height="78" rx="4"/><text class="ttl" x="171.5" y="521.0" text-anchor="middle">Meta evaluator</text><text class="lab muted" x="171.5" y="540.0" text-anchor="middle">do V scores track</text><text class="lab muted" x="171.5" y="559.0" text-anchor="middle">realized value?</text><rect class="box" x="52" y="640" width="239" height="118" rx="4"/><text class="ttl" x="171.5" y="666.0" text-anchor="middle">Out-of-band signals</text><text class="lab muted" x="171.5" y="685.0" text-anchor="middle">realized outcomes</text><text class="lab muted" x="171.5" y="704.0" text-anchor="middle">retrodiction</text><text class="lab muted" x="171.5" y="723.0" text-anchor="middle">human spot-evaluations</text><text class="lab muted" x="171.5" y="742.0" text-anchor="middle">randomized holdouts</text><path class="flow" d="M52 36.0 H22 V265.0 H51" marker-end="url(#eian-ah)"/><path class="flow" d="M291 265.0 H321 V36.0 H292" marker-end="url(#eian-ah)"/><text class="lab muted strong" x="34" y="94">Object loop</text><text class="lab" x="34" y="120">information I</text><text class="lab muted" x="34" y="139">a paper, data, an argument</text><text class="lab" x="309" y="160" text-anchor="end">payment: surprise share now</text><text class="lab" x="309" y="179" text-anchor="end">(escrowed), validation share</text><text class="lab" x="309" y="198" text-anchor="end">at resolution</text><path class="flow" d="M52 283.0 H22 V535.0 H51" marker-end="url(#eian-ah)"/><path class="flow" d="M291 535.0 H321 V283.0 H292" marker-end="url(#eian-ah)"/><text class="lab muted strong" x="34" y="336">Meta loop</text><text class="lab" x="34" y="358">V scores for each I</text><text class="lab acc strong" x="171.5" y="400" text-anchor="middle">Out of band: producers cannot</text><text class="lab acc" x="171.5" y="419" text-anchor="middle">see or choose these</text><text class="lab" x="309" y="450" text-anchor="end">revised V: agent A,</text><text class="lab" x="309" y="469" text-anchor="end">weights U, validators</text><path class="flow" d="M171.5 639 L171.5 576" marker-end="url(#eian-ah)"/><text class="lab" x="179.5" y="612">realized value</text><line class="hair" x1="0" y1="796" x2="343" y2="796"/><text class="lab strong" x="0" y="822">Zoom on the payment arrow:</text><text class="lab strong" x="0" y="841">one piece of information, over time</text><line class="flow" x1="8" y1="860" x2="8" y2="1018"/><line class="flow" x1="3" y1="866" x2="13" y2="866"/><line class="flow" x1="3" y1="930" x2="13" y2="930"/><text class="lab strong" x="22" y="871">submitted</text><text class="lab muted" x="22" y="890">surprise share into escrow,</text><text class="lab muted" x="22" y="909">measured as belief shift</text><text class="lab strong" x="22" y="935">fast partial validators</text><text class="lab muted" x="22" y="954">consistency checks, retrodiction</text><text class="lab muted" x="22" y="973">advance credit before</text><text class="lab muted" x="22" y="992">slow resolution</text><text class="lab strong" x="22" y="1023">at resolution</text><path class="flow" d="M8 1018 V1052 H38" marker-end="url(#eian-ah)"/><path class="flow" d="M8 1018 V1078 H38" marker-end="url(#eian-ah)"/><path class="flow" d="M8 1018 V1104 H38" marker-end="url(#eian-ah)"/><text class="lab" x="46" y="1057">validated: kept, plus validation share</text><text class="lab" x="46" y="1083">fails: surprise share clawed back</text><text class="lab strong" x="46" y="1109">never resolves: pay stays</text><text class="lab" x="46" y="1128">unvalidated; the persuasion</text><text class="lab" x="46" y="1147">gradient survives here</text></svg>