<figcaption>The hybrid protocol routes each part of a disputed claim to the grounding that can check it. Markets price the resolvable subclaims, consistency checks screen the debaters’ probabilities, and the judge is left with only the unresolvable residue. Each check misses one thing, so an argument that is unresolvable, consistent and obfuscated passes all three.</figcaption>
