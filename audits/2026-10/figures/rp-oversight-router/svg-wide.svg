<svg xmlns="http://www.w3.org/2000/svg" class="or-wide" viewBox="0 0 760 600" role="img" aria-label="Flow diagram of the hybrid oversight protocol. An unresolvable claim is contested in debate, which splits it three ways: resolvable subclaims go to markets and prediction games, grounded in external resolution or retrodiction; the debaters&#x27; probabilities go to consistency checks, grounded in internal coherence; the unresolvable residue goes to the judge. Markets cap the payoff on false resolvable subclaims but miss unresolvable claims; consistency checks catch incoherent beliefs but miss consistent-but-wrong ones; the judge misses obfuscated arguments. A consistent, obfuscated, unresolvable argument slips all three."><defs><marker id="orw-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" class="ahead"/></marker></defs><rect class="box" x="290" y="8" width="180" height="40" rx="4"/><text class="ttl" x="380.0" y="33.0" text-anchor="middle">Unresolvable claim</text><path class="flow" d="M380 48 L380 90" marker-end="url(#orw-ah)"/><text class="lab muted" x="390" y="74">contested in</text><rect class="box" x="280" y="92" width="200" height="58" rx="4"/><text class="ttl" x="380.0" y="116.0" text-anchor="middle">Debate</text><text class="lab muted" x="380.0" y="136.0" text-anchor="middle">splits the claim</text><text class="lab muted" x="262" y="66" text-anchor="end">Open question: who controls the split?</text><text class="lab muted" x="262" y="85" text-anchor="end">A dishonest debater can send</text><text class="lab muted" x="262" y="104" text-anchor="end">convenient subclaims to markets</text><text class="lab muted" x="262" y="123" text-anchor="end">and keep the load-bearing one</text><text class="lab muted" x="262" y="142" text-anchor="end">in the residue.</text><path class="flow" d="M380 150 L380 180 M127 180 L633 180"/><path class="flow" d="M127 180 L127 246" marker-end="url(#orw-ah)"/><text class="lab" x="136" y="207">resolvable</text><text class="lab" x="136" y="226">subclaims</text><path class="flow" d="M380 180 L380 246" marker-end="url(#orw-ah)"/><text class="lab" x="389" y="207">debaters’</text><text class="lab" x="389" y="226">probabilities</text><path class="flow" d="M633 180 L633 246" marker-end="url(#orw-ah)"/><text class="lab" x="642" y="207">unresolvable</text><text class="lab" x="642" y="226">residue</text><line class="hair" x1="7" y1="284" x2="753" y2="284"/><line class="hair" x1="7" y1="364" x2="753" y2="364"/><line class="hair" x1="7" y1="444" x2="753" y2="444"/><rect class="box" x="9" y="248" width="236" height="40" rx="4"/><text class="ttl" x="127.0" y="273.0" text-anchor="middle">Markets, prediction games</text><text class="lab muted" x="11" y="304">grounded in</text><text class="lab" x="11" y="324">external resolution, or</text><text class="lab" x="11" y="343">retrodiction against hidden facts</text><text class="lab muted" x="11" y="384">buys</text><text class="lab" x="11" y="404">caps the payoff on false</text><text class="lab" x="11" y="423">resolvable subclaims</text><text class="lab muted" x="11" y="464">lets through</text><text class="lab" x="11" y="484"><tspan class="acc">unresolvable</tspan> claims; latency;</text><text class="lab" x="11" y="503">ambiguous or gamed resolution</text><rect class="box" x="262" y="248" width="236" height="40" rx="4"/><text class="ttl" x="380.0" y="273.0" text-anchor="middle">Consistency checks</text><text class="lab muted" x="264" y="304">grounded in</text><text class="lab" x="264" y="324">internal coherence: can the</text><text class="lab" x="264" y="343">beliefs be Dutch-booked?</text><text class="lab muted" x="264" y="384">buys</text><text class="lab" x="264" y="404">catches incoherent</text><text class="lab" x="264" y="423">belief structure</text><text class="lab muted" x="264" y="464">lets through</text><text class="lab" x="264" y="484"><tspan class="acc">consistent</tspan>-but-wrong beliefs;</text><text class="lab" x="264" y="503">evasive vagueness</text><rect class="box" x="515" y="248" width="236" height="40" rx="4"/><text class="ttl" x="633.0" y="273.0" text-anchor="middle">Judge</text><text class="lab muted" x="517" y="304">grounded in</text><text class="lab" x="517" y="324">the judge’s verdict: what</text><text class="lab" x="517" y="343">persuades, not what is true</text><text class="lab muted" x="517" y="384">buys</text><text class="lab" x="517" y="404">a judge used only where</text><text class="lab" x="517" y="423">nothing else can ground it</text><text class="lab muted" x="517" y="464">lets through</text><text class="lab" x="517" y="484"><tspan class="acc">obfuscated</tspan> arguments whose</text><text class="lab" x="517" y="503">flaws cost too much to find</text><path class="accline" d="M11 514 L11 524 L749 524 L749 514 M264 514 L264 524 M380 524 L380 536"/><text class="lab acc strong" x="380" y="558" text-anchor="middle">A consistent, obfuscated, unresolvable argument slips all three.</text><text class="lab muted" x="380" y="580" text-anchor="middle">Unresolvable evades the markets, consistent passes the checks, obfuscated beats the judge.</text></svg>