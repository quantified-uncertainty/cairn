"/><text class="lab muted" x="357.0" y="53.4" text-anchor="middle">established</text><path class="brk" d="M489.5 65.4 V60.4 H616.0 V65.4"/><text class="lab muted" x="552.8" y="53.4" text-anchor="middle">approaching exit</text><line class="move" x1="357.0" y1="322.1" x2="357.0" y2="93.9" marker-start="url(#idw-ah)" marker-end="url(#idw-ah)"/><circle class="dot" cx="357.0" cy="325.1" r="3.5"/><text class="lab halo" x="347.0" y="193.9" text-anchor="end">Caught at round 50:</text><text class="lab halo" x="347.0" y="212.9" text-anchor="end">loses ΔR = $1,000</text><text class="lab muted halo" x="347.0" y="231.9" text-anchor="end">of standing</text><text class="lab muted halo" x="381.0" y="294.7" text-anchor="start">after a reset, the new</text><text class="lab muted halo" x="381.0" y="312.7" text-anchor="start">identity re-pays dues</text><text class="lab halo" x="106.0" y="344.4" text-anchor="start">Escrow $200: collected whatever the identity does next.</text><text class="lab muted halo" x="106.0" y="363.4" text-anchor="start">With cheap pseudonyms and no dues, this is all that binds.</text><text class="lab" x="357.0" y="418" text-anchor="middle">Rounds since the identity entered</text><text class="lab muted" x="357.0" y="437" text-anchor="middle">this model version retires at round 100</text><text class="lab" transform="translate(26 208.0) rotate(-90)" text-anchor="middle">Enforceable penalty B<tspan dy="4" font-size="11">eff</tspan><tspan dy="-4"> = B</tspan><tspan dy="4" font-size="11">escrow</tspan><tspan dy="-4"> + ΔR</tspan></text><text class="lab" transform="translate(684 208.0) rotate(90)" text-anchor="middle">Safe stake S* at c = 1¢, p = 5%</text></svg>