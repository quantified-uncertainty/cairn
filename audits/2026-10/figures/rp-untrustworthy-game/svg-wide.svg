<svg xmlns="http://www.w3.org/2000/svg" class="ug-wide" viewBox="0 0 760 894" role="img" aria-label="Diagram of deception as a game the defender moves first. Move 1, at design time, the defender closes channels: goal divergence (pick a venue with no lean, sometimes free), verification gap (route to a self-checkable form, often free), reproduction gap (re-run, fork, poll many models, cheap for AI), never-resolves (escrow, bonds, a trusted resolver, identity, costs infrastructure), dependence (drop the source, free) and stakes (don&#x27;t concentrate decision weight, partly free). Goal divergence, never-resolves, and the reproduction gap fused with dependence stay open on some questions: the residual attack surface. For AI the reproduction gap closes cheaply, but correlated error between models reopens it. Move 2, the deceiver works the residue: an outright lie is caught by a listener who verifies, but selective truth, framing and the unfalsifiable stay open. Move 3, the listener runs the counterfactual-deceiver test cheapest rung first: aligned, use it; verifiable, use it on its merits; reproducible, use the routed answer; deterred, use it lightly discounted; costly-to-fake form, use it discounted by the cost to fake; otherwise refuse the content and keep only the fact that it was said. Rungs one to four re-ask Move 1&#x27;s questions about the one message in hand."><defs><marker id="ugw-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" class="ahead"/></marker><marker id="ugw-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" class="aheadacc"/></marker></defs><text class="ttl" x="22" y="20">Move 1 · design-time: the defender closes channels</text><text class="lab muted" x="22" y="42">Deception needs all six preconditions to hold; closing any one makes a question safe.</text><text class="lab muted" x="22" y="61">Each column: the channel, the lever that closes it, what closing it costs the defender.</text><text class="lab strong" x="22" y="98">Goal</text><text class="lab strong" x="22" y="117">divergence</text><text class="lab" x="22" y="140">pick a venue or</text><text class="lab" x="22" y="159">framing, no lean</text><text class="lab muted" x="22" y="184">sometimes free</text><path class="flow" d="M30 206 L30 318" marker-end="url(#ugw-ah)"/><path class="gate" d="M21 228 L39 228"/><text class="lab" x="44" y="233">open on</text><text class="lab" x="44" y="252">some questions</text><text class="lab strong" x="144.333" y="98">Verification</text><text class="lab strong" x="144.333" y="117">gap</text><text class="lab" x="144.333" y="140">route it to a</text><text class="lab" x="144.333" y="159">checkable form</text><text class="lab muted" x="144.333" y="184">often free</text><path class="flow" d="M152.333 206 L152.333 228"/><path class="gate" d="M143.333 228 L161.333 228"/><text class="lab muted" x="166.333" y="233">closed</text><text class="lab strong" x="266.667" y="98">Reproduction</text><text class="lab strong" x="266.667" y="117">gap</text><text class="lab" x="266.667" y="140">re-run, fork,</text><text class="lab" x="266.667" y="159">poll models</text><text class="lab muted" x="266.667" y="184">cheap for AI</text><path class="flow" d="M274.667 206 L274.667 228"/><path class="gate" d="M265.667 228 L283.667 228"/><path class="accline" d="M274.667 216 C 289.667 219 289.667 237 274.667 244 L274.667 318" marker-end="url(#ugw-aa)"/><text class="lab muted" x="294.667" y="233">closed for AI;</text><text class="lab" x="294.667" y="252"><tspan class="acc">correlated</tspan></text><text class="lab" x="294.667" y="271"><tspan class="acc">error</tspan></text><text class="lab" x="294.667" y="290"><tspan class="acc">reopens it</tspan></text><text class="lab strong" x="389" y="98">Never-</text><text class="lab strong" x="389" y="117">resolves</text><text class="lab" x="389" y="140">escrow, bonds,</text><text class="lab" x="389" y="159">resolver, identity</text><text class="lab muted" x="389" y="184">infrastructure</text><path class="flow" d="M397 206 L397 318" marker-end="url(#ugw-ah)"/><path class="gate" d="M388 228 L406 228"/><text class="lab" x="411" y="233">open on</text><text class="lab" x="411" y="252">some questions</text><text class="lab strong" x="511.333" y="98">Dependence</text><text class="lab strong" x="511.333" y="117"></text><text class="lab" x="511.333" y="140">drop the source</text><text class="lab muted" x="511.333" y="184">free</text><path class="flow" d="M519.333 206 L519.333 318" marker-end="url(#ugw-ah)"/><path class="gate" d="M510.333 228 L528.333 228"/><text class="lab" x="533.333" y="233">open on</text><text class="lab" x="533.333" y="252">some questions</text><text class="lab strong" x="633.667" y="98">Stakes</text><text class="lab strong" x="633.667" y="117"></text><text class="lab" x="633.667" y="140">spread the</text><text class="lab" x="633.667" y="159">decision weight</text><text class="lab muted" x="633.667" y="184">partly free</text><path class="flow" d="M641.667 206 L641.667 228"/><path class="gate" d="M632.667 228 L650.667 228"/><text class="lab muted" x="655.667" y="233">closed</text><path class="bar" d="M519.333 320 L7 320"/><text class="lab" x="22" y="344"><tspan class="strong">Residual attack surface:</tspan> goal divergence you can’t design out, questions that</text><text class="lab" x="22" y="363">never resolve, and an irreplaceable advantage (reproduction gap + dependence).</text><line class="hair" x1="22" y1="392" x2="756" y2="392"/><text class="ttl" x="22" y="418">Move 2 · attack-time: the deceiver works what is left</text><text class="lab muted" x="22" y="440">Against a listener who verifies, the outright lie loses. Three payloads stay open.</text><path class="flow" d="M7 320 L7 478 L580.5 478"/><text class="lab muted" x="44" y="470">the deceiver picks one payload</text><path class="flow" d="M30 478 L30 497" marker-end="url(#ugw-ah)"/><text class="lab strong" x="22" y="514">Outright lie</text><text class="lab" x="22" y="533">caught by a listener</text><text class="lab" x="22" y="552">who verifies</text><path class="flow" d="M213.5 478 L213.5 497" marker-end="url(#ugw-ah)"/><text class="lab strong" x="205.5" y="514">Selective truth</text><text class="lab" x="205.5" y="533">only true facts, chosen;</text><text class="lab" x="205.5" y="552">hides that there was</text><text class="lab" x="205.5" y="571">a pool to choose from</text><path class="flow" d="M397 478 L397 497" marker-end="url(#ugw-ah)"/><text class="lab strong" x="389" y="514">Framing</text><text class="lab" x="389" y="533">controls the information</text><text class="lab" x="389" y="552">structure; moves even a</text><text class="lab" x="389" y="571">perfect Bayesian</text><path class="flow" d="M580.5 478 L580.5 497" marker-end="url(#ugw-ah)"/><text class="lab strong" x="572.5" y="514">The unfalsifiable</text><text class="lab" x="572.5" y="533">no checkable content;</text><text class="lab" x="572.5" y="552">LR ≈ 1 by construction</text><path class="flow" d="M30 560 L30 581"/><path class="gate" d="M21 581 L39 581"/><text class="lab muted" x="44" y="586">closed</text><path class="flow" d="M213.5 579 L213.5 612"/><path class="flow" d="M397 579 L397 612"/><path class="flow" d="M580.5 579 L580.5 612"/><path class="flow" d="M580.5 612 L7 612"/><text class="lab muted" x="227.5" y="632">the message reaches the listener</text><line class="hair" x1="22" y1="652" x2="756" y2="652"/><text class="ttl" x="22" y="678">Move 3 · runtime: the counterfactual-deceiver test</text><text class="lab muted" x="22" y="700">Could a liar in this position have produced it as cheaply if it were false?</text><text class="lab muted" x="22" y="719">Cheapest rung first. Rungs 1–4 re-ask the Move 1 question in their column.</text><path class="flow" d="M7 612 L7 772.0 L21 772.0" marker-end="url(#ugw-ah)"/><rect class="box" x="22" y="748" width="106" height="48" rx="4"/><text class="lab" x="75" y="777" text-anchor="middle">Aligned?</text><path class="flow" d="M129 772.0 L143.333 772.0" marker-end="url(#ugw-ah)"/><text class="lab muted" x="136.167" y="743" text-anchor="middle">no</text><path class="flow" d="M34 796 L34 826" marker-end="url(#ugw-ah)"/><text class="lab muted" x="42" y="816">yes</text><text class="lab" x="22" y="846">use it</text><rect class="box" x="144.333" y="748" width="106" height="48" rx="4"/><text class="lab" x="197.333" y="777" text-anchor="middle">Verifiable?</text><path class="flow" d="M251.333 772.0 L265.667 772.0" marker-end="url(#ugw-ah)"/><text class="lab muted" x="258.5" y="743" text-anchor="middle">no</text><path class="flow" d="M156.333 796 L156.333 826" marker-end="url(#ugw-ah)"/><text class="lab muted" x="164.333" y="816">yes</text><text class="lab" x="144.333" y="846">use it on</text><text class="lab" x="144.333" y="865">its merits</text><rect class="box" x="266.667" y="748" width="106" height="48" rx="4"/><text class="lab" x="319.667" y="777" text-anchor="middle">Reproducible?</text><path class="flow" d="M373.667 772.0 L388 772.0" marker-end="url(#ugw-ah)"/><text class="lab muted" x="380.833" y="743" text-anchor="middle">no</text><path class="flow" d="M278.667 796 L278.667 826" marker-end="url(#ugw-ah)"/><text class="lab muted" x="286.667" y="816">yes</text><text class="lab" x="266.667" y="846">use the routed</text><text class="lab" x="266.667" y="865">answer</text><rect class="box" x="389" y="748" width="106" height="48" rx="4"/><text class="lab" x="442" y="777" text-anchor="middle">Deterred?</text><path class="flow" d="M496 772.0 L510.333 772.0" marker-end="url(#ugw-ah)"/><text class="lab muted" x="503.167" y="743" text-anchor="middle">no</text><path class="flow" d="M401 796 L401 826" marker-end="url(#ugw-ah)"/><text class="lab muted" x="409" y="816">yes</text><text class="lab" x="389" y="846">use it, lightly</text><text class="lab" x="389" y="865">discounted</text><rect class="box" x="511.333" y="748" width="106" height="48" rx="4"/><text class="lab" x="564.333" y="768.5" text-anchor="middle">Costly-to-</text><text class="lab" x="564.333" y="785.5" text-anchor="middle">fake form?</text><path class="flow" d="M618.333 772.0 L632.667 772.0" marker-end="url(#ugw-ah)"/><text class="lab muted" x="625.5" y="743" text-anchor="middle">no</text><path class="flow" d="M523.333 796 L523.333 826" marker-end="url(#ugw-ah)"/><text class="lab muted" x="531.333" y="816">yes</text><text class="lab" x="511.333" y="846">use it, but</text><text class="lab" x="511.333" y="865">discount by how</text><text class="lab" x="511.333" y="884">cheap a fake is</text><rect class="box boxlast" x="633.667" y="748" width="106" height="48" rx="4"/><text class="lab" x="686.667" y="777" text-anchor="middle">Otherwise</text><path class="flow" d="M645.667 796 L645.667 826" marker-end="url(#ugw-ah)"/><text class="lab muted" x="653.667" y="816">refuse</text><text class="lab" x="633.667" y="846">keep only the</text><text class="lab" x="633.667" y="865">fact it was said</text></svg>