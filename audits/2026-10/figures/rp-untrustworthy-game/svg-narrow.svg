<svg xmlns="http://www.w3.org/2000/svg" class="ug-narrow" viewBox="0 0 360 1448" role="img" aria-label="Diagram of deception as a game the defender moves first. Move 1, at design time, the defender closes channels: goal divergence (pick a venue with no lean, sometimes free), verification gap (route to a self-checkable form, often free), reproduction gap (re-run, fork, poll many models, cheap for AI), never-resolves (escrow, bonds, a trusted resolver, identity, costs infrastructure), dependence (drop the source, free) and stakes (don&#x27;t concentrate decision weight, partly free). Goal divergence, never-resolves, and the reproduction gap fused with dependence stay open on some questions: the residual attack surface. For AI the reproduction gap closes cheaply, but correlated error between models reopens it. Move 2, the deceiver works the residue: an outright lie is caught by a listener who verifies, but selective truth, framing and the unfalsifiable stay open. Move 3, the listener runs the counterfactual-deceiver test cheapest rung first: aligned, use it; verifiable, use it on its merits; reproducible, use the routed answer; deterred, use it lightly discounted; costly-to-fake form, use it discounted by the cost to fake; otherwise refuse the content and keep only the fact that it was said. Rungs one to four re-ask Move 1&#x27;s questions about the one message in hand."><defs><marker id="ugn-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" class="ahead"/></marker><marker id="ugn-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" class="aheadacc"/></marker></defs><text class="ttl" x="6" y="20">Move 1 · design-time</text><text class="lab muted" x="6" y="42">The defender closes channels. Deception</text><text class="lab muted" x="6" y="61">needs all six to hold; closing one is enough.</text><text class="lab strong" x="28" y="90">Goal divergence</text><text class="lab" x="354" y="90" text-anchor="end">open on some questions</text><text class="lab" x="28" y="109">pick a venue or framing, no lean · sometimes free</text><path class="flow" d="M12 78 L12 113"/><path class="gate" d="M6 88 L18 88"/><text class="lab strong" x="28" y="136">Verification gap</text><text class="lab muted" x="354" y="136" text-anchor="end">closed</text><text class="lab" x="28" y="155">route it to a checkable form · often free</text><path class="flow" d="M12 124 L12 134"/><path class="gate" d="M6 134 L18 134"/><text class="lab strong" x="28" y="182">Reproduction gap</text><text class="lab muted" x="354" y="182" text-anchor="end">closed for AI</text><text class="lab" x="28" y="201">re-run, fork, poll models · cheap for AI</text><path class="flow" d="M12 170 L12 180"/><path class="gate" d="M6 180 L18 180"/><text class="lab" x="28" y="220"><tspan class="acc">correlated error reopens it</tspan></text><path class="accline" d="M12 172 C 24 174 24 186 12 190 L12 224"/><text class="lab strong" x="28" y="247">Never-resolves</text><text class="lab" x="354" y="247" text-anchor="end">open on some questions</text><text class="lab" x="28" y="266">escrow, bonds, resolver, identity · infrastructure</text><path class="flow" d="M12 235 L12 270"/><path class="gate" d="M6 245 L18 245"/><text class="lab strong" x="28" y="293">Dependence</text><text class="lab" x="354" y="293" text-anchor="end">open on some questions</text><text class="lab" x="28" y="312">drop the source · free</text><path class="flow" d="M12 281 L12 316"/><path class="gate" d="M6 291 L18 291"/><text class="lab strong" x="28" y="339">Stakes</text><text class="lab muted" x="354" y="339" text-anchor="end">closed</text><text class="lab" x="28" y="358">spread the decision weight · partly free</text><path class="flow" d="M12 327 L12 337"/><path class="gate" d="M6 337 L18 337"/><path class="bar" d="M6 389 L354 389"/><text class="lab" x="6" y="411"><tspan class="strong">Residual attack surface:</tspan> goal divergence</text><text class="lab" x="6" y="430">you can’t design out, questions that never</text><text class="lab" x="6" y="449">resolve, an irreplaceable advantage</text><text class="lab" x="6" y="468">(reproduction gap + dependence).</text><path class="flow" d="M12 491 L12 525" marker-end="url(#ugn-ah)"/><text class="lab muted" x="24" y="513">the deceiver works what is left</text><line class="hair" x1="6" y1="541" x2="354" y2="541"/><text class="ttl" x="6" y="565">Move 2 · attack-time</text><text class="lab muted" x="6" y="587">Against a listener who verifies, the outright</text><text class="lab muted" x="6" y="606">lie loses. Three payloads stay open.</text><text class="lab strong" x="28" y="637">Outright lie</text><path class="flow" d="M12 625 L12 635"/><path class="gate" d="M6 635 L18 635"/><text class="lab muted" x="354" y="637" text-anchor="end">closed</text><text class="lab" x="28" y="656">caught by a listener who verifies</text><text class="lab strong" x="28" y="685">Selective truth</text><path class="flow" d="M12 673 L12 746"/><text class="lab" x="28" y="704">only true facts, chosen; hides that</text><text class="lab" x="28" y="723">there was a pool to choose from</text><text class="lab strong" x="28" y="752">Framing</text><path class="flow" d="M12 740 L12 813"/><text class="lab" x="28" y="771">controls the information structure;</text><text class="lab" x="28" y="790">moves even a perfect Bayesian</text><text class="lab strong" x="28" y="819">The unfalsifiable</text><path class="flow" d="M12 807 L12 861"/><text class="lab" x="28" y="838">no checkable content; LR ≈ 1 by</text><text class="lab" x="28" y="857">construction</text><path class="flow" d="M12 872 L12 904" marker-end="url(#ugn-ah)"/><text class="lab muted" x="28" y="896">the message reaches the listener</text><line class="hair" x1="6" y1="922" x2="354" y2="922"/><text class="ttl" x="6" y="946">Move 3 · runtime: the test</text><text class="lab muted" x="6" y="968">Could a liar in this position have produced</text><text class="lab muted" x="6" y="987">it as cheaply if it were false? Cheapest</text><text class="lab muted" x="6" y="1006">rung first; rungs 1–4 re-ask the first four</text><text class="lab muted" x="6" y="1025">channels of Move 1, in order.</text><rect class="box" x="14" y="1058" width="132" height="38" rx="4"/><text class="lab" x="80" y="1082" text-anchor="middle">Aligned?</text><path class="flow" d="M147 1077.0 L200 1077.0" marker-end="url(#ugn-ah)"/><text class="lab muted" x="173.5" y="1071" text-anchor="middle">yes</text><text class="lab" x="206" y="1082">use it</text><path class="flow" d="M34 1096 L34 1125" marker-end="url(#ugn-ah)"/><text class="lab muted" x="42" y="1116">no</text><rect class="box" x="14" y="1126" width="132" height="38" rx="4"/><text class="lab" x="80" y="1150" text-anchor="middle">Verifiable?</text><path class="flow" d="M147 1145.0 L200 1145.0" marker-end="url(#ugn-ah)"/><text class="lab muted" x="173.5" y="1139" text-anchor="middle">yes</text><text class="lab" x="206" y="1150">use it on its merits</text><path class="flow" d="M34 1164 L34 1193" marker-end="url(#ugn-ah)"/><text class="lab muted" x="42" y="1184">no</text><rect class="box" x="14" y="1194" width="132" height="38" rx="4"/><text class="lab" x="80" y="1218" text-anchor="middle">Reproducible?</text><path class="flow" d="M147 1213.0 L200 1213.0" marker-end="url(#ugn-ah)"/><text class="lab muted" x="173.5" y="1207" text-anchor="middle">yes</text><text class="lab" x="206" y="1218">use the routed answer</text><path class="flow" d="M34 1232 L34 1261" marker-end="url(#ugn-ah)"/><text class="lab muted" x="42" y="1252">no</text><rect class="box" x="14" y="1262" width="132" height="38" rx="4"/><text class="lab" x="80" y="1286" text-anchor="middle">Deterred?</text><path class="flow" d="M147 1281.0 L200 1281.0" marker-end="url(#ugn-ah)"/><text class="lab muted" x="173.5" y="1275" text-anchor="middle">yes</text><text class="lab" x="206" y="1276.5">use it, lightly</text><text class="lab" x="206" y="1295.5">discounted</text><path class="flow" d="M34 1300 L34 1329" marker-end="url(#ugn-ah)"/><text class="lab muted" x="42" y="1320">no</text><rect class="box" x="14" y="1330" width="132" height="38" rx="4"/><text class="lab" x="80" y="1354" text-anchor="middle">Costly to fake?</text><path class="flow" d="M147 1349.0 L200 1349.0" marker-end="url(#ugn-ah)"/><text class="lab muted" x="173.5" y="1343" text-anchor="middle">yes</text><text class="lab" x="206" y="1335">use it, but discount</text><text class="lab" x="206" y="1354">by how cheap a fake</text><text class="lab" x="206" y="1373">is</text><path class="flow" d="M34 1368 L34 1397" marker-end="url(#ugn-ah)"/><text class="lab muted" x="42" y="1388">no</text><rect class="box boxlast" x="14" y="1398" width="132" height="38" rx="4"/><text class="lab" x="80" y="1422" text-anchor="middle">Otherwise</text><path class="flow" d="M147 1417.0 L200 1417.0" marker-end="url(#ugn-ah)"/><text class="lab muted" x="173.5" y="1411" text-anchor="middle">refuse</text><text class="lab" x="206" y="1412.5">keep only the fact it</text><text class="lab" x="206" y="1431.5">was said</text></svg>