<figcaption>Fifty audits measure the model, but not precisely enough to judge it when experts agree as weakly as in peer review. The model scores all 1,000 grants; a random 50, hidden from everyone, go to two experts, and the model–expert κ is compared with the expert–expert κ on the same 50. Each κ carries about ±0.3 of sampling error (bars, simulated with both raters renewing 80%), so 50 audits cannot tell a model that guesses (κ 0) from one as good as a second expert (κ 0.17). About 300 audits, $180,000 per expert at $600 a review, mostly separate them.</figcaption>
