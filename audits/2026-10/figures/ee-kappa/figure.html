<text x="2" y="410" text-anchor="start"><tspan x="2" class="ka-t">Same 70% raw agreement: <tspan font-style="italic">κ</tspan> = 0.40 when</tspan><tspan x="2" dy="19" class="ka-t">raters split 50/50, <tspan font-style="italic">κ</tspan> = 0.06 at 80% “yes”.</tspan><tspan x="2" dy="19" class="ka-m">50 audits: 70% ± 13 points; <tspan font-style="italic">κ</tspan> about −0.20 to 0.37.</tspan></text>
</svg>
<figcaption>The same raw agreement means very different things at different base rates. Each curve is the raw agreement needed for a given κ when both raters say “yes” at rate π; the bottom one is chance, π² + (1 − π)². At 70% agreement, κ is 0.40 when raters split 50/50 but only 0.06 in the <a href="/concepts/worked-example/#what-50-audits-buy">worked example</a>, where experts renew 80% of grants. Fifty audits put about ±13 points on that 70% (the bar), and the κ estimated from them could fall anywhere from about −0.20 to 0.37: it cannot tell this pair of raters from chance. The picture is symmetric for π below 50%.</figcaption>
</figure>
